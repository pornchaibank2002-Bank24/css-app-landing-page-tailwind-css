<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acme App - Complete Landing Page</title>
    <!-- โหลด Tailwind CSS ผ่าน CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f7fb] min-h-screen text-[#18181b] font-sans antialiased flex flex-col justify-between">

    <!-- Container หลักครอบทั้งหน้าจอ -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-grow">
        
        <!-- 1. NAVIGATION BAR -->
        <header class="bg-white rounded-full shadow-sm px-6 sm:px-8 py-4 flex items-center justify-between">
            <!-- โลโก้ Acme -->
            <div class="flex items-center">
                <span class="text-xl sm:text-2xl font-extrabold tracking-tight text-black">
                    Acme<span class="text-[#4338ca] inline-block ml-0.5">.</span>
                </span>
            </div>

            <!-- เมนูนำทางด้านขวา (ซ่อนบนมือถือขนาดเล็ก และแสดงผลแบบ Flex บนจอ Medium ขึ้นไป) -->
            <nav class="hidden md:flex items-center space-x-8 font-medium text-sm">
                <a href="#" class="text-[#4338ca] underline underline-offset-4 decoration-2 font-semibold">Home</a>
                <a href="#" class="text-gray-700 hover:text-black transition">Features</a>
                <a href="#" class="text-gray-700 hover:text-black transition">Pricing</a>
                <a href="#" class="text-gray-700 hover:text-black transition">Contact</a>
            </nav>

            <!-- ปุ่มเมนูสำหรับหน้าจอมือถือ (Hamburger Menu Icon) สำหรับเพื่อนในกลุ่มที่รับหน้าที่ทำส่วน Nav มือถือ -->
            <div class="flex md:hidden items-center">
                <button class="text-gray-700 hover:text-black focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 2. HERO SECTION -->
        <main class="flex flex-col items-center justify-center text-center mt-12 sm:mt-16 md:mt-20 px-4">
            
            <!-- Badge แสดงแท็ก Acme Productivity App -->
            <div class="inline-flex items-center gap-2 bg-[#e0e7ff] border border-[#c7d2fe] text-[#4338ca] px-3 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold mb-6">
                <span>🌈</span>
                <span>Acme Productivity App</span>
            </div>

            <!-- หัวข้อหลัก (Main Heading ปรับขนาดให้ Responsive ทุกหน้าจอ) -->
            <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight leading-tight text-[#111827] max-w-4xl">
                Boost Your <span class="text-[#4338ca]">Product</span>ivity
            </h1>

            <!-- คำอธิบายย่อย (Subheading) -->
            <p class="mt-4 text-base sm:text-xl text-gray-700 font-medium max-w-2xl px-2">
                Streamline your workflow with our all-in-one productivity app.
            </p>

            <!-- ปุ่ม Call to Action (Start Free Trial) -->
            <div class="mt-6 mb-16">
                <button class="bg-[#1e1b2e] hover:bg-[#2e2a45] text-white px-6 sm:px-7 py-3 sm:py-3.5 rounded-xl font-medium text-sm shadow-md transition duration-200 w-full sm:w-auto">
                    Start Free Trial
                </button>
            </div>

        </main>
    </div>
